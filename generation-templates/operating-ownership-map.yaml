# Templates are authored expert judgment, versioned as product assets. The template drives the
# outline; the corpus never defines scope.
#
# PROVISIONAL v1 — landed under autonomous-run rules 2026-07-17; operator review by exception pending.
# Fill modes: corpus | recommend | operator | structural | informational.

template: operating-ownership-map
version: 1
ruled: "2026-07-17"
title: Ownership & Accountability Map
deliverable: ownership-map
applies_to: [OPS-01]
default_mode: artifact   # MODE MATRIX (operator-ruled 2026-07-18); per-company default, subject to generation-time mode_conditions.
professional_review: none

exclusions:
  - No benchmark pass/fail values — never present a "good/bad" threshold as a judgment.
  - No internal reference-model language (B-##, band names, tile ids) in customer documents.
  - No padding metrics or filler — every element earns its place.

sections:
  - id: function-inventory
    title: Function inventory
    fill_mode: [corpus, operator]
    required_content:
      - Every business function the company actually runs (product, GTM, finance ops, vendor, infra, physical ops where applicable).
  - id: owners
    title: Named owners
    fill_mode: [operator]
    required_content:
      - ONE named owner per function (form free — Accountability Chart / DRI register / RACI).
    conditionality: Owner assignments are operator decisions.
  - id: currency
    title: Currency & discoverability
    fill_mode: [structural]
    required_content:
      - Evidence the map is current and discoverable to a new hire or board.
  - id: decisions-required
    title: Decisions required
    fill_mode: [structural]
    required_content:
      - Aggregate every per-company decision as a plain-language question.
    conditionality: Always present.
