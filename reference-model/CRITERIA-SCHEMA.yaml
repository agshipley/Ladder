  COMP:
    band: "Band 1 -- seed-funded B2B SaaS/infra, pre-Series A (reference-corpus-calibrated), US scope"
    subcategories:

      - id: COMP-01
        criterion: |-
          Detection of the artifacts by which the company proves its security
          posture to outsiders. All elements trigger-conditional per Sec. 4; all at
          whole-artifact grain per Sec. 0.

          (a) Attestation artifacts. SOC 2 report — ONE object; Type 1 = design
              opinion at a point in time, Type 2 = operating-effectiveness opinion
              over a period (AICPA TSP 100 para .16). ISO 27001 certificate — one
              object. ISO 42001-class AI-management certificate — one object (B-28;
              ISO/IEC 42001:2023, first AIMS standard, certification market in its
              first growth wave 2026). Scored: where T-A/T-B/T-E exists, the
              responsive artifact or a dated in-progress engagement record exists
              and is current (a draft report or executed auditor engagement letter is
              itself the in-progress engagement record) (a Type 2 report has a period;
              a lapsed period is stale evidence — maturity is operational readiness,
              never mere existence).
          (b) Review-response record. Completed security questionnaires (SIG / CAIQ
              / custom DDQ responses) retained and current. The Band-1-native form
              of the category: the questionnaire arrives before the SOC 2 demand
              does. Scored on T-A.
          (c) Demanded-artifact match. Where a demand instrument names specific
              artifacts (a policy document, a pen-test report, training records, a
              COI), those artifacts exist or their absence is a recorded open item.
              The demand's list is the list (Sec. 0 rule 1).

          Cross-references, never re-scored: privacy/DPA/subprocessor → LEGAL-09;
          accessibility/marketing → LEGAL-10; AI regulatory record → LEGAL-09(h);
          AI governance practice → AI Operations; security practice-in-use →
          Engineering; certification status cross-referenced BY operating categories
          as corroboration (B-32/B-17).
          [9E-b amendment v1.1, 2026-07-11: the certification DEFAULT is documented-n-a. The ONLY in-scope sector is B2B SaaS/infra handling customer data (off-sector instances -- e.g. CPG/agency with no B2B SaaS motion -- render documented-n-a). In-sector but PRE-DEMAND (no T-A/T-B/T-E trigger): score the roadmap/awareness record -- a certification-awareness or roadmap line; its absence anywhere renders THIN. Demand-trigger met: score the certification posture itself per (a)-(c) above.]
          [Clarified v1.2, operator-ruled 2026-07-15 — fixture FX-05 encodes the ruled intent: an in-progress engagement satisfies element (a) at Band 1.]
        state: *state_vocabulary
        grain: whole-artifact
        conditionality: trigger-conditional
        references: ["B-17", "B-28", "B-32", "LEGAL-09", "LEGAL-10", "certification-awareness-floor"]
        signals: ["auditor-letterhead PDFs (\"Type II\", \"Trust Services"]
        provenance: authority-backed
        refresh: []
        version: v1.2

      - id: COMP-02
        criterion: |-
          B-5 as scoped by B-26: corporate risk insurance only. Detection of
          EXECUTED policies matched to triggers:

          (a) Policy schedule exists: carrier, coverage type, limits, period per
              policy (declarations pages or a maintained schedule). Converged Band-1
              baseline (multi-source market practice, weight-marked): GL (lease/
              accelerator-driven); Tech E&O + cyber (contract/data-driven); D&O
              (financing-driven); workers' comp (statutory on first employee).
          (b) Trigger match: every active trigger (T-B COI clauses, T-C covenants,
              T-D statute) has a responsive in-force policy. The executed
              instrument's own terms govern; the NVCA-default 90-day D&O window is
              context annotation only (single-source figure, weight-marked; the
              covenant text in the closing set is the corpus-verifiable fact).
          (c) Currency: renewal dates tracked. A lapsed policy against a live
              covenant is the category's clearest red state.
          (d) COI capability: certificates producible (contract-driven trigger
              only).

          Boundary discipline: obligation records → Legal/Capital; statutory
          mandates → Legal; benefit insurance → People (B-26). Policies multi-home
          as evidence into Legal's executed-contract record (B-17); the
          portfolio-to-trigger adequacy join is owned here and nowhere else.
        state: *state_vocabulary
        grain: whole-artifact
        conditionality: trigger-conditional
        references: ["B-5", "B-17", "B-26"]
        signals: ["ACORD forms, declarations pages, carrier names,"]
        provenance: authority-backed
        refresh: []
        version: v1.0

      - id: COMP-03
        criterion: |-
          B-18's Compliance half. Boundary anchor: AICPA TSC CC9.2 (verbatim at
          Sec. 2). Two elements, whole-artifact grain:

          (a) Minimal always-on bar (expert-authored, defensively written): critical
              data processors identified on the OPS-05 vendor inventory (multi-
              homed, B-17) and their attestations on file (their SOC 2 / ISO cert /
              DPA). Nothing programmatic is required. Rationale: cheap artifact set;
              universally requested by the demand side; an unchecked critical
              processor is the company's most concentrated undocumented dependency.
          (b) Post-trigger (T-A/T-B): the received review's vendor-management
              section is answered — the demand defines any further requirement
              (Sec. 0 rule 1). No standing TPRM program, tiering scheme, or
              reassessment cadence is a Band-1 model criterion.

          Boundary discipline: the vendor operating process is OPS-05's, never
          re-scored; a GRC platform is never a criterion.
        state: *state_vocabulary
        grain: whole-artifact
        conditionality: trigger-conditional
        references: ["B-17", "B-18", "OPS-05"]
        signals: ["third-party-attributed SOC 2 PDFs", "DPA"]
        provenance: mixed(authority-backed/expert-authored)
        refresh: []
        version: v1.0
