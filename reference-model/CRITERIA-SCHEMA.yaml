# v1.4 (2026-07-15): definitions +rollup precedence (v3); naming note; FIN-06 v1.1,
#   FIN-07 v1.1, AIOPS-02 v1.1, COMP-01 v1.2 (operator-ruled amendments); rollup v3.1;
